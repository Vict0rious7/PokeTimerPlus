name: CI

# Build and test PokeTimerPlus on Windows, Ubuntu and macOS (adapted from PokeFinderPlus's matrix-os.yaml).
# A tag vX.Y.Z (or vX.Y.Z-beta.1, published as a pre-release) also publishes a GitHub release with
# PokeTimerPlus-windows.zip and PokeTimerPlus-macos.zip, named like EonTimer's release assets.
# The tag must match `project(... VERSION X.Y.Z)` in CMakeLists.txt.

on:
  push:
    branches:
      - "main"
      - "feature/**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build (${{ matrix.platform-name }})
    runs-on: ${{ matrix.os }}
    env: ${{ matrix.env || fromJSON('{}') }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform-name: Windows
            cache-key: windows
            qt-archives: qtbase

          - os: ubuntu-24.04
            platform-name: Ubuntu
            cache-key: ubuntu
            qt-archives: icu qtbase
            env: { CC: gcc-14, CXX: g++-14 }

          - os: macos-15
            platform-name: macOS
            cache-key: macos
            qt-archives: qtbase

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check the tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          version=$(sed -n 's/^project(PokeTimerPlus VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "Tag $GITHUB_REF_NAME, CMakeLists.txt version $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in CMakeLists.txt (the About box shows the CMake version)."
            exit 1
          fi

      - name: Install Ninja (Windows)
        if: matrix.platform-name == 'Windows'
        run: choco install ninja -y

      - name: Install Ninja (Ubuntu)
        if: matrix.platform-name == 'Ubuntu'
        run: |
          sudo apt update
          sudo apt install -y ninja-build libgl1-mesa-dev libxkbcommon-dev

      - name: Install Ninja (macOS)
        if: matrix.platform-name == 'macOS'
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          archives: ${{ matrix.qt-archives }}
          cache: true

      - name: Initialize ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-${{ matrix.cache-key }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ matrix.cache-key }}-main-
            ccache-${{ matrix.cache-key }}-

      - name: Configure Developer Command Prompt (Windows)
        if: matrix.platform-name == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTEST=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            ${{ matrix.platform-name == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"' || '' }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      # The zip must run on a PC without Qt or Visual Studio: Qt DLLs and plugins from windeployqt,
      # and the Visual C++ runtime DLLs copied next to the .exe (app-local, so no vc_redist install).
      - name: Package (Windows)
        if: matrix.platform-name == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory PokeTimerPlus | Out-Null
          Move-Item build/PokeTimerPlus.exe PokeTimerPlus/
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler PokeTimerPlus/PokeTimerPlus.exe
          Remove-Item PokeTimerPlus/vc_redist*.exe -ErrorAction SilentlyContinue
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { Write-Error "Visual C++ runtime not found under $env:VCToolsRedistDir"; exit 1 }
          Copy-Item "$($crt.FullName)\*.dll" PokeTimerPlus/
          Copy-Item LICENSE PokeTimerPlus/LICENSE.txt
          Get-ChildItem -Recurse PokeTimerPlus | Select-Object -ExpandProperty FullName
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path PokeTimerPlus -DestinationPath dist/PokeTimerPlus-windows.zip

      # Start the packaged .exe the way a friend would: from the unzipped folder, with no Qt on PATH.
      # It saves a screenshot after start-up and quits (POKETIMERPLUS_SCREENSHOT); no screenshot = broken zip.
      - name: Smoke test the zip (Windows)
        if: matrix.platform-name == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive dist/PokeTimerPlus-windows.zip -DestinationPath smoke
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:POKETIMERPLUS_SCREENSHOT = "$PWD\smoke-windows.png"
          $p = Start-Process -FilePath smoke/PokeTimerPlus/PokeTimerPlus.exe -PassThru
          $null = $p.Handle  # keeps ExitCode readable after WaitForExit
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error "PokeTimerPlus did not quit within 60 s"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "PokeTimerPlus exited with code $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path smoke-windows.png)) { Write-Error "No screenshot: the window did not come up"; exit 1 }
          Write-Host "Packaged app started and saved its window."

      - name: Upload smoke-test screenshot (Windows)
        if: matrix.platform-name == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: smoke-windows
          path: smoke-windows.png

      # Ad-hoc signature so Apple Silicon Macs accept the bundle after macdeployqt changed it.
      # ditto keeps the bundle's symlinks, which a plain zip would break.
      - name: Package (macOS)
        if: matrix.platform-name == 'macOS'
        run: |
          mv build/PokeTimerPlus.app .
          macdeployqt PokeTimerPlus.app
          codesign --force --deep --sign - PokeTimerPlus.app
          mkdir dist
          ditto -c -k --sequesterRsrc --keepParent PokeTimerPlus.app dist/PokeTimerPlus-macos.zip

      - name: Upload artifact
        if: matrix.platform-name != 'Ubuntu'
        uses: actions/upload-artifact@v6
        with:
          name: PokeTimerPlus-${{ matrix.platform-name }}
          path: dist

  # One job publishes the release once both builds passed (two matrix jobs writing the same release can race).
  release:
    name: Publish release
    needs: ci
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v7
        with:
          pattern: PokeTimerPlus-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/PokeTimerPlus-windows.zip
            dist/PokeTimerPlus-macos.zip
          body: |
            ## Download

            - **Windows (10 or 11, 64-bit):** `PokeTimerPlus-windows.zip` below. Unzip it anywhere (not inside the zip view) and run `PokeTimerPlus.exe` in the `PokeTimerPlus` folder. Windows may say "Windows protected your PC" because the app isn't signed: click **More info → Run anyway**.
            - **macOS (Intel or Apple Silicon):** `PokeTimerPlus-macos.zip` below. Unzip, move `PokeTimerPlus.app` to Applications, then right-click it → **Open** the first time (the app isn't notarised).

            Calibrations from EonTimer won't carry over exactly (the beeps reach the speaker sooner): calibrate once per RNG type, then **Save to profile**.
            Bugs and questions: [issues](https://github.com/${{ github.repository }}/issues).
