name: CI

# Build and test PokeTimerPlus on Windows, Ubuntu and macOS (adapted from PokeFinderPlus's matrix-os.yaml).
# Tags vX.Y.Z also publish a GitHub release with the Windows and macOS builds.

on:
  push:
    branches:
      - "main"
      - "feature/**"
    tags:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+"
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Build (${{ matrix.platform-name }})
    runs-on: ${{ matrix.os }}
    env: ${{ matrix.env || fromJSON('{}') }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform-name: Windows
            cache-key: windows
            qt-archives: qtbase

          - os: ubuntu-24.04
            platform-name: Ubuntu
            cache-key: ubuntu
            qt-archives: icu qtbase
            env: { CC: gcc-14, CXX: g++-14 }

          - os: macos-15
            platform-name: macOS
            cache-key: macos
            qt-archives: qtbase

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Ninja (Windows)
        if: matrix.platform-name == 'Windows'
        run: choco install ninja -y

      - name: Install Ninja (Ubuntu)
        if: matrix.platform-name == 'Ubuntu'
        run: |
          sudo apt update
          sudo apt install -y ninja-build libgl1-mesa-dev libxkbcommon-dev

      - name: Install Ninja (macOS)
        if: matrix.platform-name == 'macOS'
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          archives: ${{ matrix.qt-archives }}
          cache: true

      - name: Initialize ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-${{ matrix.cache-key }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ matrix.cache-key }}-main-
            ccache-${{ matrix.cache-key }}-

      - name: Configure Developer Command Prompt (Windows)
        if: matrix.platform-name == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTEST=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            ${{ matrix.platform-name == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"' || '' }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package (Windows)
        if: matrix.platform-name == 'Windows'
        run: |
          mkdir PokeTimerPlus
          mv build/PokeTimerPlus.exe PokeTimerPlus/
          windeployqt --no-translations --no-opengl-sw --no-system-d3d-compiler PokeTimerPlus/PokeTimerPlus.exe
          rm -Force PokeTimerPlus/vc_redist*.exe -ErrorAction SilentlyContinue
          7z a PokeTimerPlus-win.zip PokeTimerPlus
          mkdir upload
          mv PokeTimerPlus upload

      - name: Package (macOS)
        if: matrix.platform-name == 'macOS'
        run: |
          mv build/PokeTimerPlus.app .
          macdeployqt PokeTimerPlus.app
          tar czf PokeTimerPlus-macOS.tar.gz PokeTimerPlus.app
          mkdir upload && mv PokeTimerPlus.app upload

      - name: Upload artifact
        if: matrix.platform-name != 'Ubuntu'
        uses: actions/upload-artifact@v6
        with:
          name: PokeTimerPlus-${{ matrix.platform-name }}
          path: upload

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform-name != 'Ubuntu'
        with:
          files: |
            PokeTimerPlus-win.zip
            PokeTimerPlus-macOS.tar.gz
