<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- PokeTimerPlus logo: a stopwatch built on the PokeFinderPlus pokeball ring.
       Same colours as PokeFinderPlus: orange #F15A24, navy #1B1464. -->
  <defs>
    <mask id="hollow">
      <rect width="256" height="256" fill="white"/>
      <circle cx="128" cy="149" r="72" fill="black"/>
    </mask>
  </defs>
  <!-- case: pokeball ring and band -->
  <g fill="#F15A24">
    <circle cx="128" cy="149" r="106" mask="url(#hollow)"/>
    <rect x="30" y="134" width="47" height="30"/>
    <rect x="179" y="134" width="47" height="30"/>
  </g>
  <g fill="#1B1464">
    <!-- crown: cap and stem -->
    <rect x="96" y="2" width="64" height="22" rx="6"/>
    <rect x="116" y="22" width="24" height="18"/>
    <!-- lap button at 45 degrees -->
    <rect x="112" y="13" width="32" height="24" rx="5" transform="rotate(45 128 149)"/>
  </g>
  <!-- centre: pokeball button holding the + -->
  <circle cx="128" cy="149" r="34" fill="none" stroke="#1B1464" stroke-width="17"/>
  <g fill="#F15A24">
    <rect x="109" y="142.5" width="38" height="13"/>
    <rect x="121.5" y="130" width="13" height="38"/>
  </g>
</svg>
